name: Báo cáo lỗi
description: Phản hồi lỗi hoặc vấn đề của plugin này
labels: ["bug"]
assignees:
  - ybw0014
body:
  - type: markdown
    attributes:
      value: |
        ## Chào mừng đến với trình theo dõi lỗi SlimefunGuguProject
        Bạn đang báo cáo lỗi cho phiên bản dịch của InfinityExpansion.
        Nên đọc [bài viết này](https://slimefun-wiki.guizhanss.cn/How-to-report-bugs) để biết cách báo cáo lỗi đúng cách.

        <strong><i>Bạn phải điền các mục được đánh dấu sao (*)</i></strong>

  - type: checkboxes
    id: checklist
    attributes:
      label: Danh sách kiểm tra
      description: Trước khi báo cáo, bạn cần xác nhận
      options:
        - label: Bạn đang sử dụng phiên bản tải từ trang build (https://builds.guizhanss.net)
          required: true
        - label: Bạn đã kiểm tra checksum của file tải xuống, xác nhận đã tải đầy đủ (chưa ra mắt)
          required: false
        - label: Bạn chưa thay đổi bất kỳ nội dung nào của file đã tải
          required: true
        - label: Bạn chưa cài đặt `CS-CoreLib`
          required: true
        - label: Bạn đã tìm kiếm [danh sách vấn đề đã biết](https://github.com/SlimefunGuguProject/InfinityExpansion/issues) và không tìm thấy vấn đề tương tự
          required: true

  - type: textarea
    id: description
    attributes:
      label: Mô tả vấn đề
      description: |
        Mô tả chi tiết vấn đề bạn muốn báo cáo
        Cung cấp thông tin chi tiết giúp chúng tôi xử lý vấn đề nhanh hơn
      placeholder: Chỉ nói "không dùng được" không giúp nhà phát triển xác định vấn đề.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Các bước tái hiện
      description: |
        Vui lòng mô tả chi tiết cách để tái hiện vấn đề này
        Nếu có video, vui lòng cung cấp liên kết video tại đây
      placeholder: |
        1. xxx
        2. xxx
    validations:
      required: true

  - type: textarea
    id: expected-behavior
    attributes:
      label: Hành vi mong đợi
      description: |
        Bạn nghĩ điều gì nên xảy ra
        Đôi khi, nguyên nhân vấn đề là bạn hiểu nhầm chức năng nào đó.
    validations:
      required: true

  - type: input
    id: server-log
    attributes:
      label: Nhật ký máy chủ
      description: |
        Vui lòng kiểm tra nhật ký máy chủ xem có lỗi nào không, nếu có hãy tải lên [https://paste.guizhanss.net/](https://paste.guizhanss.net/) và điền liên kết tại đây.
        **Không dán nhật ký trực tiếp tại đây**
      placeholder: https://paste.guizhanss.net/...
    validations:
      required: false

  - type: input
    id: error-report
    attributes:
      label: Báo cáo lỗi
      description: |
        Nếu nhật ký máy chủ đề cập đến file trong `/plugins/Slimefun/error-reports` (tức báo cáo lỗi)
        Vui lòng tải lên [https://paste.guizhanss.net/](https://paste.guizhanss.net/) và điền liên kết tại đây.
        **Không dán báo cáo lỗi trực tiếp tại đây**
      placeholder: https://paste.guizhanss.net/...
    validations:
      required: false

  - type: dropdown
    id: server-software
    attributes:
      label: Phần mềm máy chủ
      description: Vui lòng chọn phần mềm máy chủ bạn đang sử dụng
      options:
        - Spigot
        - Paper
        - Purpur
        - Airplane
        - Khác (vui lòng ghi rõ trong phần mô tả vấn đề)
    validations:
      required: true

  - type: dropdown
    id: minecraft-version
    attributes:
      label: Phiên bản Minecraft
      description: Vui lòng chọn phiên bản Minecraft của bạn
      options:
        - 1.19.x
        - 1.18.x
        - 1.17.x
        - 1.16.x
        - Plugin này không hỗ trợ phiên bản cũ
    validations:
      required: true

  - type: checkboxes
    id: cscorelib-version
    attributes:
      label: Phiên bản CS-CoreLib
      description: |
        Từ ngày 30 tháng 1 năm 2021, Slimefun và các plugin addon của nó không cần cài đặt CS-CoreLib nữa.
        Giữ lại CS-CoreLib có thể gây ra một số vấn đề không xác định.
      options:
        - label: Tôi chưa cài đặt CS-CoreLib
          required: true

  - type: textarea
    id: slimefun-version
    attributes:
      label: Phiên bản Slimefun
      description: |
        Vui lòng điền phiên bản Slimefun
        (ví dụ: v4.9-canary-08120db)
        Nếu bạn có quyền quản trị viên, hãy chạy lệnh `/sf versions`, chụp màn hình và tải lên **toàn bộ nội dung** đầu ra của lệnh tại đây.
    validations:
      required: true

  - type: input
    id: version-plugin
    attributes:
      label: Phiên bản plugin
      description: |
        Vui lòng điền phiên bản plugin
        Chỉ cần điền số phiên bản sau chữ Build
        (`Build 7 zh-CN(ybw0014) (git 9ef7fee)` chỉ cần điền `7`)
    validations:
      required: true
