# Bật cập nhật tự động
auto-update: true

balance-options:

  # Đặt hệ số nhân nguyên liệu tiêu hao của điểm kỳ dị
  singularity-cost-multiplier: 1.0

  # Cho phép bộ chuyển đổi chất liệu trang bị thay đổi chất liệu trang bị trong Slimefun.
  # Trang bị kim cương có thể nâng cấp lên netherite, nhưng một số vật phẩm từ addon có thể không dùng được sau khi nâng cấp
  # Hãy cẩn thận khi bật tùy chọn này!!
  allow-sf-item-transform: false

  # Có bật nghiên cứu cho vật phẩm Infinity Expansion không
  # Khi bật, người chơi cần tiêu hao cấp độ để mở khóa vật phẩm (giống với cài đặt Slimefun)
  enable-researches: false

# Cài đặt liên quan đến mô phỏng sinh vật
mob-simulation-options:

  # Cứ mỗi bao nhiêu tick Slimefun xuất sản phẩm và kinh nghiệm
  # Nếu không thay đổi cài đặt Slimefun, 1 tick Slimefun = 0.5 giây
  ticks-per-output: 20

  # Đặt hệ số nhân kinh nghiệm nhận được từ mô phỏng sinh vật
  xp-multiplier: 1.0

# Cài đặt liên quan đến máy đào
quarry-options:

  # Xác suất kích hoạt máy tăng tốc sản xuất mỗi khi tạo quặng (phạm vi: 0~1)
  oscillators:
    lapis: .5
    diamond: .5
    redstone: .5
    quartz: .5
    emerald: .5

  # Cứ mỗi bao nhiêu tick Slimefun xuất sản phẩm
    # Nếu không thay đổi cài đặt Slimefun, 1 tick Slimefun = 0.5 giây
  ticks-per-output: 10

  # Cho phép máy đào ở không phải Nether xuất sản phẩm Nether (thạch anh, netherrack, netherite)
  output-nether-materials-in-overworld: false

  # Cho phép máy đào xuất những tài nguyên nào
  resources:

    coal: true
    iron: true
    gold: true
    lapis: true
    # Đồng nguyên bản (1.17+)
    copper: true
    quartz: true
    diamond: true
    emerald: true
    redstone: true
    netherite: true
    netherrack: true
  
# Đặt giới hạn cấp độ phù phép cho đe cao cấp
advanced-anvil-max-levels:
  sharpness: 9
  bane-of-arthropods: 9
  smite: 9
  protection: 10
  fortune: 6
  efficiency: 7
  fire-aspect: 6
  power: 7
  thorns: 13
  looting: 6
  unbreaking: 13

# Đặt cấp độ phù phép cho bộ giáp vô cực, sẽ không ảnh hưởng đến bộ giáp vô cực đã chế tạo
# Thêm phù phép khác ở đây không có hiệu lực, bạn chỉ có thể thay đổi cấp độ của phù phép hiện có
# Nếu tổng cấp độ bảo vệ của tất cả giáp vượt quá 20, thì chỉ tính theo 20
infinity-enchant-levels:
  blade:
    unbreakable: true
    sharpness: 20
    looting: 10
    fire-aspect: 10
  pickaxe:
    unbreakable: true
    efficiency: 40
    fortune: 20
  shovel:
    unbreakable: true
    efficiency: 40
    silk-touch: 10
  axe:
    unbreakable: true
    efficiency: 40
    sharpness: 20
    fire-aspect: 10
    looting: 0
    silk-touch: 0
  bow:
    unbreakable: true
    power: 10
    flame: 10
    infinity: 10
    punch: 0
  crown:
    unbreakable: true
    protection: 20
    aqua-affinity: 10
  chestplate:
    unbreakable: true
    protection: 20
    thorns: 10
  leggings:
    unbreakable: true
    protection: 20
    thorns: 10
  boots:
    unbreakable: true
    protection: 20
    feather-falling: 0
    thorns: 0
  shield:
    unbreakable: true
    protection: 20
    thorns: 10
